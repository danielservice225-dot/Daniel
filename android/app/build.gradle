plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.daniel.aura'
    compileSdk 35

    defaultConfig {
        applicationId 'com.daniel.aura'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '2.0.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
